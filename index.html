<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주제별 의견 앱11</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-top">
                <div class="header-title-wrap">
                    <h1>💭 주제별 의견11</h1>
                    <p class="subtitle">주제를 선택하고 의견을 남겨보세요</p>
                </div>
                <a href="login.html" class="btn-login">로그인</a>
            </div>
        </header>

        <main class="main">
            <!-- 권한자: 주제 추가 -->
            <section class="admin-section">
                <h2 class="admin-title">📌 권한자: 주제 입력</h2>
                <form id="topicForm">
                    <input type="text" id="topicTitle" placeholder="주제를 입력하세요" maxlength="80" required>
                    <input type="password" id="topicAdminPin" placeholder="주제 삭제용 비밀번호 (4~8자리)" minlength="4" maxlength="8" required>
                    <button type="submit" class="btn-add-topic">주제 추가</button>
                </form>
            </section>

            <!-- 주제 목록 (각 주제 바로 밑에 의견 표시) -->
            <section class="topic-list" id="topicList">
                <!-- 주제 블록들이 여기에 표시됩니다 -->
            </section>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
