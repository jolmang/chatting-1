<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 주제별 의견</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-top">
                <h1>📝 회원가입</h1>
                <a href="login.html" class="btn-close-page">돌아가기</a>
            </div>
        </header>

        <main class="main">
            <section class="login-section">
                <form id="signupForm" class="login-form">
                    <input type="email" name="email" placeholder="이메일" required autocomplete="email">
                    <input type="password" name="password" placeholder="비밀번호" required autocomplete="new-password" minlength="6">
                    <button type="submit" class="btn-add-topic">회원가입</button>
                </form>
                <a href="login.html" class="login-back-link">로그인 페이지로</a>
            </section>
        </main>
    </div>
</body>
</html>
